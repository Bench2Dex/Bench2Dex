description: Open the toilet lid with left hand, pour cleaner into toilet with right hand, close the toilet lid with left hand.
table:
  size: [2.2, 1.1, 0.04]
  height: 0.75
zones:
  tabletop:
    aabb:
      - [-1.1, -0.55, 0.75]
      - [1.1, 0.55, 0.75]
assets:
  a121_toilet:
    path: ../../dex2bench_dataset/Objects/121_toilet/01_toilet/01/usd_decomposition_linux/mobility.usd
    scale: [0.33, 0.33, 0.33]
    body_type: articulation
    spawn:
      articulation_props:
        fix_root_link: true
      mass_props:
        density: 680.0
      joint_limits:
        joint_0:
          lower: -1.0
          upper: 0.7
          unit: rad
      joint_pos:
        joint_0: -1.0
      actuators:
        joints:
          joint_names_expr: [joint_0, joint_1]
          effort_limit_sim: 80.0
          velocity_limit_sim: 8.0
          stiffness: 0.0
          damping: 0.0
  a021_bleach_cleanser:
    path: ../../dex2bench_dataset/Objects/021_bleach_cleanser/usd_decomposition_linux/textured.usd
    scale: [0.9, 0.9, 0.9]
    body_type: dynamic
objects:
  - id: obj_121_toilet_1
    asset: a121_toilet
    rpy_deg: [0, 0, 100]
    position: [-0.1, 0.3]
  - id: obj_021_bleach_cleanser_2
    asset: a021_bleach_cleanser
    rpy_deg: [0, 0, 0]
    position: [0.22, 0.15]
layout:
  zone: tabletop
  objects: [obj_121_toilet_1, obj_021_bleach_cleanser_2]
  yaw_range: [0, 360]
success_conditions:
  - type: custom
    evaluator: success.custom.task_51_toilet_lid_cleaner_pour
metrics:
  task_family: articulation_multi
  expert_time_step: 2046
  expert_time_source: mean steps_to_stable_success over 50/50 successful demos from origin-generalization
  grasp:
    enabled: true
    lift_margin: 0.02
    ang_vel_threshold: 1.0
    fall_vel_threshold: 0.5
    min_hold_frames: 3
    slip_lin_vel: 0.3
    slip_ang_vel: 2.0
    gsi_weights: [0.3, 0.3, 0.2, 0.2]
    min_hold_s: 0.5
    max_slip_count: 3
    gsi_threshold: 0.5
    release_stable_s: 0.3
    switch_timeout_s: 5.0
    tracked_objects: [obj_021_bleach_cleanser_2]
  tool_equivalence_classes:
    cleaner: [obj_021_bleach_cleanser_2]
  terminal:
    dwell_time_s: 0.5
    raw_condition:
      type: custom
      evaluator: success.custom.task_51_toilet_lid_cleaner_pour
  stages:
    - id: open_lid
      depends_on: []
      success_condition:
        type: joint_state
        object: obj_121_toilet_1
        joint: joint_0
        target: 0.4
        tolerance: 0.2
    - id: pour_cleaner
      depends_on: [open_lid]
      tool_class: cleaner
      success_condition:
        type: custom
        evaluator: success.custom.task_51_toilet_lid_cleaner_pour
        params:
          mode: pour_only
    - id: close_lid
      depends_on: [pour_cleaner]
      success_condition:
        type: joint_state
        object: obj_121_toilet_1
        joint: joint_0
        target: -1.0
        tolerance: 0.1
  safety:
    table_z: 0.75
    drop:
      enabled: true
      tracked_objects: [obj_021_bleach_cleanser_2]
      lift_margin: 0.05
      drop_height: 0.08
      settle_margin: 0.03
      fall_vel_threshold: 0.25
      allowed_placed_conditions:
        obj_021_bleach_cleanser_2:
          type: object_in_zone
          object: obj_021_bleach_cleanser_2
          aabb:
            - [-1.1, -0.55, 0.73]
            - [1.1, 0.55, 1.5]
