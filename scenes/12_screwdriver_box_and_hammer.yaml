description: "Use the right hand to place the right screwdriver into the box and move the box to the left, use the left hand to place the left screwdriver into the box, then pick up the hammer, strike the wooden block once, and place the hammer into the box."
table:
  size: [2.2, 1.1, 0.04]
  height: 0.75
zones:
  tabletop:
    aabb:
      - [-1.1, -0.55, 0.75]
      - [1.1, 0.55, 0.75]
assets:
  a043_phillips_screwdriver:
    path: ../../dex2bench_dataset/Objects/043_phillips_screwdriver/usd_decomposition_linux/textured.usd
    scale: [1.0, 1.0, 1.0]
    body_type: dynamic
  a044_flat_screwdriver:
    path: ../../dex2bench_dataset/Objects/044_flat_screwdriver/usd_decomposition_linux/textured.usd
    scale: [1.0, 1.0, 1.0]
    body_type: dynamic
  a048_hammer:
    path: ../../dex2bench_dataset/Objects/048_hammer/usd_decomposition_linux/textured.usd
    scale: [1.0, 1.0, 1.0]
    body_type: dynamic
    spawn:
      mass_props:
        mass: 0.5
  a036_wood_block:
    path: ../../dex2bench_dataset/Objects/036_wood_block/usd_decomposition_linux/textured.usd
    scale: [1.0, 1.0, 1.0]
    body_type: dynamic
  a154_wooden_box:
    path: ../../dex2bench_dataset/Objects/154_wooden_box/usd_decomposition_linux/base0.usd
    scale: [0.15, 0.15, 0.15]
    body_type: dynamic
objects:
  - id: obj_043_phillips_screwdriver_1
    asset: a043_phillips_screwdriver
    rpy_deg: [0, 0, 0]
    position: [-0.45, 0.12]
  - id: obj_044_flat_screwdriver_2
    asset: a044_flat_screwdriver
    rpy_deg: [0, 0, 0]
    position: [0.25, 0.03]
  - id: obj_048_hammer_3
    asset: a048_hammer
    rpy_deg: [0, 180, -30]
    position: [-0.27, 0.11]
  - id: obj_036_wood_block_4
    asset: a036_wood_block
    rpy_deg: [90, 0, 0]
    position: [-0.1, 0.06]
  - id: obj_154_wooden_box_1
    asset: a154_wooden_box
    rpy_deg: [90, 0, 0]
    position: [0.5, 0.27]
layout:
  zone: tabletop
  objects: [obj_043_phillips_screwdriver_1, obj_044_flat_screwdriver_2, obj_048_hammer_3, obj_036_wood_block_4, obj_154_wooden_box_1]
  yaw_range: [0, 360]
success_conditions:
  - type: custom
    evaluator: success.custom.task_12_screwdriver_box_and_hammer
metrics:
  task_family: tool_precision_place
  expert_time_step: 2297
  expert_time_source: "mean steps_to_stable_success over 50/50 successful demos from origin-generalization"
  grasp:
    enabled: true
    lift_margin: 0.02
    ang_vel_threshold: 1.0
    fall_vel_threshold: 0.5
    min_hold_frames: 3
    slip_lin_vel: 0.3
    slip_ang_vel: 2.0
    gsi_weights: [0.3, 0.3, 0.2, 0.2]
    min_hold_s: 0.5
    max_slip_count: 3
    gsi_threshold: 0.5
    release_stable_s: 0.3
    switch_timeout_s: 5.0
    tracked_objects: [obj_043_phillips_screwdriver_1, obj_044_flat_screwdriver_2, obj_048_hammer_3]
  tool_equivalence_classes:
    screwdriver: [obj_043_phillips_screwdriver_1, obj_044_flat_screwdriver_2]
    hammer: [obj_048_hammer_3]
  contact_pairs:
    - sensor: obj_048_hammer_3
      filter_targets: [obj_036_wood_block_4]
  terminal:
    dwell_time_s: 0.5
    raw_condition:
      type: all
      conditions:
        - type: custom
          evaluator: success.custom.task_12_screwdriver_box_and_hammer
        - type: object_static
          object: obj_043_phillips_screwdriver_1
          threshold: 0.05
          check_angular: false
        - type: object_static
          object: obj_044_flat_screwdriver_2
          threshold: 0.05
          check_angular: false
        - type: object_static
          object: obj_048_hammer_3
          threshold: 0.05
          check_angular: false
  stages:
    - id: place_flat_right
      depends_on: []
      success_condition:
        type: all
        conditions:
          - type: object_upright
            object: obj_154_wooden_box_1
            tolerance_deg: 30
            local_axis: y
          - type: object_inside
            object: obj_044_flat_screwdriver_2
            container: obj_154_wooden_box_1
            tolerance: 0.18
          - type: object_static
            object: obj_044_flat_screwdriver_2
            threshold: 0.05
            check_angular: false
    - id: place_phillips_left
      depends_on: [place_flat_right]
      success_condition:
        type: all
        conditions:
          - type: object_upright
            object: obj_154_wooden_box_1
            tolerance_deg: 30
            local_axis: y
          - type: object_inside
            object: obj_043_phillips_screwdriver_1
            container: obj_154_wooden_box_1
            tolerance: 0.18
          - type: object_static
            object: obj_043_phillips_screwdriver_1
            threshold: 0.05
            check_angular: false
    - id: hammer_strike_wood
      depends_on: [place_phillips_left]
      tool_class: hammer
      success_condition:
        type: custom
        evaluator: success.custom.task_12_screwdriver_box_and_hammer
        params:
          mode: hammer_strike
    - id: place_hammer
      depends_on: [hammer_strike_wood]
      tool_class: hammer
      success_condition:
        type: custom
        evaluator: success.custom.task_12_screwdriver_box_and_hammer
        params:
          mode: hammer_placed
  safety:
    table_z: 0.75
    drop:
      enabled: true
      tracked_objects: [obj_043_phillips_screwdriver_1, obj_044_flat_screwdriver_2, obj_048_hammer_3]
      lift_margin: 0.05
      drop_height: 0.08
      settle_margin: 0.03
      fall_vel_threshold: 0.25
      allowed_placed_conditions:
        obj_043_phillips_screwdriver_1:
          type: all
          conditions:
            - type: object_upright
              object: obj_154_wooden_box_1
              tolerance_deg: 30
              local_axis: y
            - type: object_inside
              object: obj_043_phillips_screwdriver_1
              container: obj_154_wooden_box_1
              tolerance: 0.18
        obj_044_flat_screwdriver_2:
          type: all
          conditions:
            - type: object_upright
              object: obj_154_wooden_box_1
              tolerance_deg: 30
              local_axis: y
            - type: object_inside
              object: obj_044_flat_screwdriver_2
              container: obj_154_wooden_box_1
              tolerance: 0.18
        obj_048_hammer_3:
          type: all
          conditions:
            - type: object_upright
              object: obj_154_wooden_box_1
              tolerance_deg: 30
              local_axis: y
            - type: object_inside
              object: obj_048_hammer_3
              container: obj_154_wooden_box_1
              tolerance: 0.18
