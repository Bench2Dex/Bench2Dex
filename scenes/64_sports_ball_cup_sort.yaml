description: "Place the tennis ball and baseball into the large cup, place the racquetball and golf ball into the small cup."
table:
  size: [2.2, 1.1, 0.04]
  height: 0.75
zones:
  tabletop:
    aabb: [[-1.1, -0.55, 0.75], [1.1, 0.55, 0.75]]
assets:
  a065d_cups:
    path: ../../dex2bench_dataset/Objects/065-d_cups/google_16k/usd_sdf_linux/textured.usd
    scale: [1.9, 1.9, 1.9]
    body_type: dynamic
    spwan:
      mass_props:
        mass: 0.6
  a065e_cups:
    path: ../../dex2bench_dataset/Objects/065-e_cups/google_16k/usd_sdf_linux/textured.usd
    scale: [1.45, 1.45, 1.45]
    body_type: dynamic
    spwan:
      mass_props:
        mass: 0.6
  a054_softball:
    path: ../../dex2bench_dataset/Objects/054_softball/usd_decomposition_linux/textured.usd
    scale: [0.8, 0.8, 0.8]
    body_type: dynamic
  a055_baseball:
    path: ../../dex2bench_dataset/Objects/055_baseball/usd_decomposition_linux/textured.usd
    scale: [1.0, 1.0, 1.0]
    body_type: dynamic
  a057_racquetball:
    path: ../../dex2bench_dataset/Objects/057_racquetball/usd_decomposition_linux/textured.usd
    scale: [1.2, 1.2, 1.2]
    body_type: dynamic
  a058_golf_ball:
    path: ../../dex2bench_dataset/Objects/058_golf_ball/usd_decomposition_linux/textured.usd
    scale: [1.5, 1.5, 1.5]
    body_type: dynamic
objects:
  - id: obj_065_d_cups_1
    asset: a065d_cups
    rpy_deg: [0, 0, 0]
    position: [0.05, 0.32]
  - id: obj_065_e_cups_2
    asset: a065e_cups
    rpy_deg: [0, 0, 0]
    position: [0.05, 0.15]
  - id: obj_054_softball_3
    asset: a054_softball
    rpy_deg: [0, 0, 0]
    position: [-0.4, 0.2]
  - id: obj_055_baseball_4
    asset: a055_baseball
    rpy_deg: [0, 0, 0]
    position: [0.4, 0.16]
  - id: obj_057_racquetball_5
    asset: a057_racquetball
    rpy_deg: [0, 0, 0]
    position: [-0.17, 0.32]
  - id: obj_058_golf_ball_6
    asset: a058_golf_ball
    rpy_deg: [0, 0, 0]
