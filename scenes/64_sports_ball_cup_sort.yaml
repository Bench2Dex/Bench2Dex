  task_family: rigid_pick_place
  expert_time_step: 1329
  expert_time_source: "mean steps_to_stable_success over 50/50 successful demos from replay-generalization"
  grasp:
    enabled: true
    lift_margin: 0.02
    ang_vel_threshold: 1.0
    fall_vel_threshold: 0.5
    min_hold_frames: 3
    slip_lin_vel: 0.3
    slip_ang_vel: 2.0
    gsi_weights: [0.3, 0.3, 0.2, 0.2]
    min_hold_s: 0.5
    max_slip_count: 3
    gsi_threshold: 0.5
    release_stable_s: 0.3
    switch_timeout_s: 5.0
    tracked_objects: [obj_054_softball_3, obj_055_baseball_4, obj_057_racquetball_5, obj_058_golf_ball_6]
