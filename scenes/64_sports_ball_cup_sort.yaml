  objects: [obj_065_d_cups_1, obj_065_e_cups_2, obj_054_softball_3, obj_055_baseball_4, obj_057_racquetball_5, obj_058_golf_ball_6]
  yaw_range: [0, 360]
success_conditions:
  - type: all
    conditions:
      - type: all
        conditions:
          - type: object_upright
            object: obj_065_d_cups_1
            tolerance_deg: 30
          - type: object_inside
            object: obj_054_softball_3
            container: obj_065_d_cups_1
            tolerance: 0.15
            container_center_offset: [-0.0372599, -0.1190131, 0.0]
            object_center_offset: [-0.019673, 0.010704, 0.0469735]
      - type: all
        conditions:
          - type: object_upright
            object: obj_065_d_cups_1
            tolerance_deg: 30
          - type: object_inside
            object: obj_055_baseball_4
            container: obj_065_d_cups_1
            tolerance: 0.15
            container_center_offset: [-0.0372599, -0.1190131, 0.0]
            object_center_offset: [-0.010081, -0.048245, 0.0360765]
