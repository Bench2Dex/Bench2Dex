          - type: object_inside
            object: obj_058_golf_ball_6
            container: obj_065_e_cups_2
            tolerance: 0.15
            container_center_offset: [-0.0295407, -0.109347, 0.0]
            object_center_offset: [-0.0098092, -0.0456563, 0.0314152]
  - type: object_static
    object: obj_054_softball_3
    threshold: 0.05
    check_angular: false
  - type: object_static
    object: obj_055_baseball_4
    threshold: 0.05
    check_angular: false
  - type: object_static
    object: obj_057_racquetball_5
    threshold: 0.05
    check_angular: false
  - type: object_static
    object: obj_058_golf_ball_6
    threshold: 0.05
    check_angular: false
