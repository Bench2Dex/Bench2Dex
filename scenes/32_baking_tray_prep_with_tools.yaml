description: Use the left hand to place the brush and spatula onto the tray, use the right hand to place the small pudding box then the large gelatin box onto the tray in sequence.
table:
  size: [2.2, 1.1, 0.04]
  height: 0.75
zones:
  tabletop:
    aabb: [[-1.1, -0.55, 0.75], [1.1, 0.55, 0.75]]
assets:
  a130_tray:
    path: ../../dex2bench_dataset/Objects/130_tray/usd_decomposition_linux/base3.usd
    scale: [0.2, 0.2, 0.2]
    body_type: dynamic
  a008_pudding_box:
    path: ../../dex2bench_dataset/Objects/008_pudding_box/usd_decomposition_linux/textured.usd
    scale: [1, 1, 1]
    body_type: dynamic
  a009_gelatin_box:
    path: ../../dex2bench_dataset/Objects/009_gelatin_box/usd_decomposition_linux/textured.usd
    scale: [1, 1, 1]
    body_type: dynamic
  a033_spatula:
    path: ../../dex2bench_dataset/Objects/033_spatula/usd_decomposition_linux/textured.usd
    scale: [1, 1, 1]
    body_type: dynamic
  a189_brush:
    path: ../../dex2bench_dataset/Objects/189_brush/usd_decomposition_linux/base3.usd
    scale: [0.12, 0.12, 0.12]
    body_type: dynamic
objects:
- id: obj_130_tray_1
  asset: a130_tray
  rpy_deg: [90, 0, 0]
  position: [0.0, 0.33]
- id: obj_008_pudding_box_2
  asset: a008_pudding_box
  rpy_deg: [0, 0, 0]
  position: [-0.35, 0.33]
- id: obj_009_gelatin_box_3
  asset: a009_gelatin_box
  rpy_deg: [0, 0, 0]
  position: [-0.25, 0.24]
- id: obj_033_spatula_4
  asset: a033_spatula
  rpy_deg: [0, 0, 210]
  position: [0.04, 0.0]
- id: obj_189_brush_5
  asset: a189_brush
  rpy_deg: [0, 270, 0]
  position: [0.3, 0.2]
layout:
  zone: tabletop
  objects: [obj_130_tray_1, obj_008_pudding_box_2, obj_009_gelatin_box_3, obj_033_spatula_4, obj_189_brush_5]
  yaw_range: [0, 360]
success_conditions:
- type: custom
  evaluator: success.custom.task_32_baking_tray_prep_with_tools
metrics:
  task_family: rigid_pick_place
  expert_time_step: 1703
  expert_time_source: "mean steps_to_stable_success over 50/50 successful demos from replay-generalization"
  grasp:
    enabled: true
    lift_margin: 0.02
    ang_vel_threshold: 1.0
    fall_vel_threshold: 0.5
    min_hold_frames: 3
    slip_lin_vel: 0.3
    slip_ang_vel: 2.0
    gsi_weights: [0.3, 0.3, 0.2, 0.2]
    min_hold_s: 0.5
    max_slip_count: 3
    gsi_threshold: 0.5
    release_stable_s: 0.3
    switch_timeout_s: 5.0
    tracked_objects: [obj_008_pudding_box_2, obj_009_gelatin_box_3, obj_033_spatula_4, obj_189_brush_5]
  terminal:
    dwell_time_s: 0.5
    raw_condition:
      type: all
      conditions:
      - type: object_on
        object: obj_008_pudding_box_2
        target: obj_130_tray_1
        tolerance_xy: 0.22
        tolerance_z: 0.18
        target_center_offset: [1.42e-05, 0.022275, 0.0]
        object_center_offset: [0.000505, 0.019123, 0.0189475]
      - type: object_on
        object: obj_009_gelatin_box_3
        target: obj_130_tray_1
        tolerance_xy: 0.22
        tolerance_z: 0.18
        target_center_offset: [1.42e-05, 0.022275, 0.0]
        object_center_offset: [-0.022775, -0.008245, 0.014492]
      - type: object_on
        object: obj_033_spatula_4
        target: obj_130_tray_1
        tolerance_xy: 0.22
        tolerance_z: 0.18
        target_center_offset: [1.42e-05, 0.022275, 0.0]
        object_center_offset: [-0.027178, -0.097023, 0.0157785]
      - type: object_on
        object: obj_189_brush_5
        target: obj_130_tray_1
        tolerance_xy: 0.22
        tolerance_z: 0.18
        target_center_offset: [1.42e-05, 0.022275, 0.0]
        object_center_offset: [0.0, 0.0881286, 0.0]
      - type: object_static
        object: obj_008_pudding_box_2
        threshold: 0.05
        check_angular: false
      - type: object_static
        object: obj_009_gelatin_box_3
        threshold: 0.05
        check_angular: false
      - type: object_static
        object: obj_033_spatula_4
        threshold: 0.05
        check_angular: false
      - type: object_static
        object: obj_189_brush_5
        threshold: 0.05
        check_angular: false
      - type: object_upright
        object: obj_130_tray_1
        tolerance_deg: 30
        local_axis: y
  stages:
  - id: place_pudding
    depends_on: []
    success_condition:
      type: all
      conditions:
      - type: object_on
        object: obj_008_pudding_box_2
        target: obj_130_tray_1
        tolerance_xy: 0.22
        tolerance_z: 0.18
        target_center_offset: [1.42e-05, 0.022275, 0.0]
        object_center_offset: [0.000505, 0.019123, 0.0189475]
      - type: object_static
        object: obj_008_pudding_box_2
        threshold: 0.05
        check_angular: false
      - type: object_upright
        object: obj_130_tray_1
        tolerance_deg: 30
        local_axis: y
  - id: place_gelatin
    depends_on: []
    success_condition:
      type: all
      conditions:
      - type: object_on
        object: obj_009_gelatin_box_3
        target: obj_130_tray_1
        tolerance_xy: 0.22
        tolerance_z: 0.18
        target_center_offset: [1.42e-05, 0.022275, 0.0]
        object_center_offset: [-0.022775, -0.008245, 0.014492]
      - type: object_static
        object: obj_009_gelatin_box_3
        threshold: 0.05
        check_angular: false
      - type: object_upright
        object: obj_130_tray_1
        tolerance_deg: 30
        local_axis: y
  - id: place_spatula
    depends_on: [place_pudding, place_gelatin]
    success_condition:
      type: all
      conditions:
      - type: object_on
        object: obj_033_spatula_4
        target: obj_130_tray_1
        tolerance_xy: 0.22
        tolerance_z: 0.18
        target_center_offset: [1.42e-05, 0.022275, 0.0]
        object_center_offset: [-0.027178, -0.097023, 0.0157785]
      - type: object_static
        object: obj_033_spatula_4
        threshold: 0.05
        check_angular: false
      - type: object_upright
        object: obj_130_tray_1
        tolerance_deg: 30
        local_axis: y
  - id: place_brush
    depends_on: [place_pudding, place_gelatin]
    success_condition:
      type: all
      conditions:
      - type: object_on
        object: obj_189_brush_5
        target: obj_130_tray_1
        tolerance_xy: 0.22
        tolerance_z: 0.18
        target_center_offset: [1.42e-05, 0.022275, 0.0]
        object_center_offset: [0.0, 0.0881286, 0.0]
      - type: object_static
        object: obj_189_brush_5
        threshold: 0.05
        check_angular: false
      - type: object_upright
        object: obj_130_tray_1
        tolerance_deg: 30
        local_axis: y
  safety:
    table_z: 0.75
    drop:
      enabled: true
      tracked_objects: [obj_008_pudding_box_2, obj_009_gelatin_box_3, obj_033_spatula_4, obj_189_brush_5]
      allowed_placed_conditions:
        obj_008_pudding_box_2:
          type: object_on
          object: obj_008_pudding_box_2
          target: obj_130_tray_1
          tolerance_xy: 0.22
          tolerance_z: 0.18
          target_center_offset: [1.42e-05, 0.022275, 0.0]
          object_center_offset: [0.000505, 0.019123, 0.0189475]
        obj_009_gelatin_box_3:
          type: object_on
          object: obj_009_gelatin_box_3
          target: obj_130_tray_1
          tolerance_xy: 0.22
          tolerance_z: 0.18
          target_center_offset: [1.42e-05, 0.022275, 0.0]
          object_center_offset: [-0.022775, -0.008245, 0.014492]
        obj_033_spatula_4:
          type: object_on
          object: obj_033_spatula_4
          target: obj_130_tray_1
          tolerance_xy: 0.22
          tolerance_z: 0.18
          target_center_offset: [1.42e-05, 0.022275, 0.0]
          object_center_offset: [-0.027178, -0.097023, 0.0157785]
        obj_189_brush_5:
          type: object_on
          object: obj_189_brush_5
          target: obj_130_tray_1
          tolerance_xy: 0.22
          tolerance_z: 0.18
          target_center_offset: [1.42e-05, 0.022275, 0.0]
          object_center_offset: [0.0, 0.0881286, 0.0]
