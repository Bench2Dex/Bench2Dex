retargeting:
  type: DexPilot
  scaling_factor: 1.07
  project_dist: 0.01
  escape_dist: 0.02
  low_pass_alpha: 0.2

  hand_offset_xyz: [0, 0, 0.04]
  hand_scale_xyz: [1, 1.0, 1.0]
  mano_correction_vis: true

  # Mimic joints are already handled in Isaac Sim USD, so ignore them in dex_retargeting
  ignore_mimic_joint: true

  right:
    urdf_path: ur5+RH56DFX/urdf/Right_Hand.urdf
    wrist_link_name: "r_base_link"
    finger_tip_link_names:
      - right_thumb_tip
      - right_index_tip
      - right_middle_tip
      - right_ring_tip
      - right_little_tip
    target_joint_names:
      - right_thumb_1_joint
      - right_thumb_2_joint
      - right_index_1_joint
      - right_middle_1_joint
      - right_ring_1_joint
      - right_little_1_joint
    mano_to_pinocchio_rpy: [1.5708, -1.5708, 0]
    sim_wrist_to_pin_root_rpy: [0, 0, 0]

  left:
    urdf_path: ur5+RH56DFX/urdf/Left_Hand.urdf
    wrist_link_name: "l_base_link"
    finger_tip_link_names:
      - left_thumb_tip
      - left_index_tip
      - left_middle_tip
      - left_ring_tip
      - left_little_tip
    target_joint_names:
      - left_thumb_1_joint
      - left_thumb_2_joint
      - left_index_1_joint
      - left_middle_1_joint
      - left_ring_1_joint
      - left_little_1_joint
    mano_to_pinocchio_rpy: [-1.5708, -1.5708, 0]
    sim_wrist_to_pin_root_rpy: [0, 0, 0]
