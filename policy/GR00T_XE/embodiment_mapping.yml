# Special hand notes
# ==================
# Allegro: only 4 fingers (no pinky).  Recorded names are Isaac-sanitized:
#   right "multi_joint_1_0" etc, left "joint_1_0" (UNDERSCORE, not "joint_1.0").
#   Authored rows: joint_13_0+14_0=thumb, 1_0+2_0=index, 5_0+6_0=middle, 9_0+10_0=ring.
# Leap: 4 fingers (thumb/index/middle/ring — no pinky), 16 joints per hand.
#   Recorded right = multi_leap_r_0..15, left = leap_l_0..15.
#   Finger groups taken from the leap URDF kinematic chain + *_tip_head fixed
#   joints: index = chain ending "fingertip", middle = "fingertip_2", ring =
#   "fingertip_3", thumb = 12..15.  Within a finger the authored slots follow
#   palm→tip kinematic order → base0, base1, mid0, mid1 (base1 of index/middle/
#   ring are the retargeter's locked "abd" joints 0/4/8).  Review on real hand.
# Schunk: has Finger_Spread (global, not per-finger) → mapped to wrist_0 slot.
# Orca: has wrist joint → mapped to wrist_0 slot.
# RH56DFX: only 1 active joint per finger (thumb has 2), rest are mimic/coupled.
# Revo2: only 1 active joint per finger except thumb has 2.
# Jaka/Wuji: 4 joints per finger, all active.
